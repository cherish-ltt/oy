[package]
name = "oy-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
oy-agent = { path = "../oy-agent" }
crossterm = { version = "0.28.1", features = ["event-stream", "bracketed-paste"] }
futures = "0.3.31"
ratatui = "0.30.0"
tokio = { version = "1.40.0", features = ["full"] }
color-eyre = "0.6.3"
unicode-width = "0.2"
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "6"
anyhow = "1"

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true