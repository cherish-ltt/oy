[package]
name = "oy-code-cli"
version = "0.2.0"
edition = "2024"
description = "CLI entry point for oy"
license = "MIT"
repository = "https://github.com/cherish-ltt/oy"

[[bin]]
name = "oy"
path = "src/main.rs"

[dependencies]
oy-agent = { path = "../oy-agent", version = "0.2.0" }
oy-ai = { path = "../oy-ai", version = "0.2.0" }
oy-tui = { path = "../oy-tui", version = "0.2.0" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "6"
anyhow = "1"
color-eyre = "0.6.3"
