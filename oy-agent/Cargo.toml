[package]
name = "oy-agent"
version = "0.1.2"
edition = "2024"
description = "Agent orchestration for oy"
license = "MIT"
repository = "https://github.com/cherish-ltt/oy"

[dependencies]
oy-ai = { path = "../oy-ai", version = "0.1.2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
dirs = "6"
chrono = "0.4.44"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
