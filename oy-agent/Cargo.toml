[package]
name = "oy-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
oy-ai = { path = "../oy-ai" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v7", "serde"] }
dirs = "6"
chrono = "0.4.44"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
