[workspace]
resolver = "2"
members = ["oy-ai", "oy-agent", "oy-code-cli", "oy-tui"]

[workspace.package]
version = "0.8.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/cherish-ltt/oy"

[workspace.dependencies]
# ── Internal workspace crates ──
oy-ai       = { path = "oy-ai", version = "0.8.1" }
oy-agent    = { path = "oy-agent", version = "0.8.1" }
oy-tui      = { path = "oy-tui", version = "0.8.1" }

# ── Async runtime & concurrency ──
tokio       = { version = "1", features = ["rt-multi-thread", "macros", "sync", "process", "time"] }
futures     = { version = "0.3", default-features = false, features = ["std", "async-await"] }
async-trait = "0.1"

# ── Serialization ──
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
toml        = "=1.1.2"

# ── CLI / TUI ──
clap        = { version = "4", features = ["derive"] }
crossterm   = { version = "0.29.0", features = ["event-stream", "bracketed-paste"] }
ratatui     = "0.30.2"
unicode-width = "0.2.2"
pulldown-cmark = { version = "0.13", default-features = false }

# ── Error handling ──
thiserror   = "2"
anyhow      = "1"
color-eyre  = "0.6.3"

# ── AI / LLM ──
async-openai = { version = "=0.41.1", features = ["byot", "chat-completion"] }
tiktoken-rs = "0.12.0"

# ── Logging ──
log         = "0.4.33"

# ── Utilities ──
dirs        = "6"
chrono      = { version = "0.4.45", default-features = false, features = ["clock"] }
uuid        = { version = "1.24.0", features = ["v4", "v7"] }
regex       = "1"
tempfile    = "3"

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
