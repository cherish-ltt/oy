[package]
name = "oy-ai"
version = "0.3.0"
edition = "2024"
description = "AI provider abstraction layer for oy"
license = "MIT"
repository = "https://github.com/cherish-ltt/oy"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
async-openai = { version = "=0.40.3", features = ["byot", "chat-completion"] }
