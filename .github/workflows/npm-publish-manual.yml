name: Manual NPM Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.2.3 or v1.2.3)'
        required: true
        type: string
      npm_tag:
        description: 'npm dist-tag (latest, beta, next, etc.)'
        required: false
        default: 'latest'
        type: string

env:
  CARGO_TERM_COLOR: always

permissions:
  id-token: write
  contents: read

jobs:
  publish-npm:
    name: Publish to npm (manual)
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Normalize version
        id: version
        run: |
          RAW_VERSION="${{ github.event.inputs.version }}"
          CLEAN_VERSION="${RAW_VERSION#v}"
          TAG="v${CLEAN_VERSION}"
          echo "version=${CLEAN_VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'

      - name: Prepare npm package
        run: |
          mkdir -p npm-package/bin/native
          cd npm-package

          cat > package.json <<EOF
          {
            "name": "@ghyper9023/oy",
            "version": "${{ steps.version.outputs.version }}",
            "description": "AI-Agent CLI tool named oy",
            "bin": {
              "oy": "bin/oy-wrapper.js"
            },
            "dependencies": {
              "follow-redirects": "^1.16.0"
            },
            "publishConfig": {
              "access": "public",
              "provenance": true
            },
            "scripts": {
              "postinstall": "node bin/install.js"
            },
            "files": [
              "bin"
            ],
            "keywords": ["cli", "oy"],
            "author": "Your Name",
            "license": "MIT",
            "repository": {
              "type": "git",
              "url": "git+https://github.com/cherish-ltt/oy.git"
            },
            "homepage": "https://github.com/cherish-ltt/oy#readme",
            "bugs": {
              "url": "https://github.com/cherish-ltt/oy/issues"
            }
          }
          EOF

          cat > bin/install.js <<'INSTALL_JS'
          #!/usr/bin/env node

          const fs = require('fs');
          const path = require('path');
          const os = require('os');
          const { https } = require('follow-redirects');

          const pkgJson = require('../package.json');
          const version = pkgJson.version;
          const repoUrl = pkgJson.repository && pkgJson.repository.url;
          if (!repoUrl) {
            console.error('Missing repository.url in package.json');
            process.exit(1);
          }
          const match = repoUrl.match(/github\.com[\/:]([^\/]+\/[^\/]+)(\.git)?$/);
          if (!match) {
            console.error(`Failed to parse owner/repo from repository.url: ${repoUrl}`);
            process.exit(1);
          }
          const repo = match[1];
          const tag = `v${version}`;

          function getPlatformAsset() {
            const platform = os.platform();
            const arch = os.arch();
            console.log(`Detected platform: ${platform}, arch: ${arch}`);

            if (platform === 'win32') {
              // Windows: currently only x64 builds are provided.
              if (arch === 'x64' || arch === 'ia32' || arch === 'arm64') {
                console.log('Using Windows x64 binary (compatible with all Windows architectures)');
                return 'oy-x86_64-pc-windows-msvc.exe';
              } else {
                throw new Error(`Unsupported Windows architecture: ${arch}`);
              }
            } else if (platform === 'linux') {
              if (arch === 'x64') {
                return 'oy-x86_64-unknown-linux-gnu';
              } else if (arch === 'arm64') {
                // Placeholder if you build for Linux ARM64 in the future
                throw new Error('Linux ARM64 is not yet supported');
              } else {
                throw new Error(`Unsupported Linux architecture: ${arch}`);
              }
            } else if (platform === 'darwin') {
              if (arch === 'arm64') {
                return 'oy-aarch64-apple-darwin';
              } else if (arch === 'x64') {
                // If you build Intel macOS binaries, add them here
                throw new Error('macOS x64 is not yet supported');
              } else {
                throw new Error(`Unsupported macOS architecture: ${arch}`);
              }
            } else {
              throw new Error(`Unsupported platform: ${platform}`);
            }
          }

          const assetName = getPlatformAsset();
          const destDir = path.join(__dirname, 'native');
          const destFile = path.join(destDir, os.platform() === 'win32' ? 'oy.exe' : 'oy');
          const url = `https://github.com/${repo}/releases/download/${tag}/${assetName}`;

          console.log(`Downloading from ${url} ...`);

          if (!fs.existsSync(destDir)) fs.mkdirSync(destDir, { recursive: true });

          const file = fs.createWriteStream(destFile);
          https.get(url, (response) => {
            if (response.statusCode !== 200) {
              console.error(`Failed to download ${url}: HTTP ${response.statusCode}`);
              process.exit(1);
            }
            response.pipe(file);
            file.on('finish', () => {
              file.close();
              fs.chmodSync(destFile, 0o755);
              console.log(`Binary saved to ${destFile}`);
            });
          }).on('error', (err) => {
            console.error(err);
            process.exit(1);
          });
          INSTALL_JS

          cat > bin/oy-wrapper.js <<'WRAPPER_JS'
          #!/usr/bin/env node
          const { spawn } = require('child_process');
          const path = require('path');
          const os = require('os');

          const exePath = path.join(__dirname, 'native', os.platform() === 'win32' ? 'oy.exe' : 'oy');
          const args = process.argv.slice(2);
          const child = spawn(exePath, args, { stdio: 'inherit' });
          child.on('exit', (code) => process.exit(code));
          WRAPPER_JS

      - name: Publish to npm with provenance
        run: |
          cd npm-package
          npm publish --provenance --access public --tag ${{ github.event.inputs.npm_tag }}
