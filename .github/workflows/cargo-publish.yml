name: Publish to crates.io

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # Publish in dependency order: oy-ai -> oy-agent -> oy-tui -> oy-code-cli
      - name: Publish oy-ai
        run: cargo publish -p oy-ai --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Publish oy-agent
        run: cargo publish -p oy-agent --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Publish oy-tui
        run: cargo publish -p oy-tui --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Publish oy-code-cli
        run: cargo publish -p oy-code-cli --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
