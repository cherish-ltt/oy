name: Release Build and Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g., v1.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release?'
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: Build oy-code-cli (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RAW_TAG="${{ github.event.inputs.tag_name }}"
            CLEAN_TAG=$(echo "$RAW_TAG" | xargs)
          else
            CLEAN_TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [[ -z "$CLEAN_TAG" ]]; then
            echo "❌ Error: tag name is empty"
            exit 1
          fi
          echo "Using release tag: $CLEAN_TAG"
          echo "tag=$CLEAN_TAG" >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout specific tag (for manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git fetch --tags
          git checkout tags/${{ steps.tag.outputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build -p oy-code-cli --release

      - name: Rename binary with platform suffix
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            ubuntu-latest)
              PLATFORM="x86_64-unknown-linux-gnu"
              EXT=""
              ;;
            macos-latest)
              PLATFORM="aarch64-apple-darwin"
              EXT=""
              ;;
            windows-latest)
              PLATFORM="x86_64-pc-windows-msvc"
              EXT=".exe"
              ;;
          esac
          cp "target/release/oy${EXT}" "oy-${PLATFORM}${EXT}"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: oy-*
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish to npm with OIDC
    runs-on: ubuntu-latest
    needs: build
    environment: release
    permissions:
      id-token: write
      contents: read
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch')
    steps:
      - name: Determine version from tag
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Prepare npm package
        run: |
          mkdir -p npm-package/bin/native
          cd npm-package

          cat > package.json <<EOF
          {
            "name": "@ghyper9023/oy",
            "version": "${{ steps.version.outputs.version }}",
            "description": "AI-Agent CLI tool named oy",
            "bin": {
              "oy": "bin/oy-wrapper.js"
            },
            "dependencies": {
              "follow-redirects": "^1.16.0"
            },
            "publishConfig": {
              "access": "public",
              "provenance": true
            },
            "scripts": {
              "postinstall": "node bin/install.js"
            },
            "files": [
              "bin"
            ],
            "keywords": ["cli", "oy"],
            "author": "Your Name",
            "license": "MIT",
            "repository": {
              "type": "git",
              "url": "https://github.com/cherish-ltt/oy"
            }
          }
          EOF

          cat > bin/install.js <<'INSTALL_JS'
          #!/usr/bin/env node

          const fs = require('fs');
          const path = require('path');
          const os = require('os');
          const { https } = require('follow-redirects');

          const pkgJson = require('../package.json');
          const version = pkgJson.version;
          const repoUrl = pkgJson.repository && pkgJson.repository.url;
          if (!repoUrl) {
            console.error('package.json 中缺少 repository.url 字段');
            process.exit(1);
          }
          const match = repoUrl.match(/github\.com[\/:]([^\/]+\/[^\/]+)(\.git)?$/);
          if (!match) {
            console.error(`无法从 repository.url 解析出 owner/repo: ${repoUrl}`);
            process.exit(1);
          }
          const repo = match[1];
          const tag = `v${version}`;

          function getPlatformAsset() {
            const platform = os.platform();
            const arch = os.arch();
            if (platform === 'linux' && arch === 'x64') {
              return 'oy-x86_64-unknown-linux-gnu';
            } else if (platform === 'darwin' && arch === 'arm64') {
              return 'oy-aarch64-apple-darwin';
            } else if (platform === 'win32' && arch === 'x64') {
              return 'oy-x86_64-pc-windows-msvc.exe';
            } else {
              throw new Error(`Unsupported platform: ${platform} ${arch}`);
            }
          }

          const assetName = getPlatformAsset();
          const destDir = path.join(__dirname, 'native');
          const destFile = path.join(destDir, os.platform() === 'win32' ? 'oy.exe' : 'oy');
          const url = `https://github.com/${repo}/releases/download/${tag}/${assetName}`;

          console.log(`Downloading from ${url} ...`);

          if (!fs.existsSync(destDir)) fs.mkdirSync(destDir, { recursive: true });

          const file = fs.createWriteStream(destFile);
          https.get(url, (response) => {
            if (response.statusCode !== 200) {
              console.error(`Failed to download ${url}: HTTP ${response.statusCode}`);
              process.exit(1);
            }
            response.pipe(file);
            file.on('finish', () => {
              file.close();
              fs.chmodSync(destFile, 0o755);
              console.log(`Binary saved to ${destFile}`);
            });
          }).on('error', (err) => {
            console.error(err);
            process.exit(1);
          });
          INSTALL_JS

          cat > bin/oy-wrapper.js <<'WRAPPER_JS'
          #!/usr/bin/env node
          const { spawn } = require('child_process');
          const path = require('path');
          const os = require('os');

          const exePath = path.join(__dirname, 'native', os.platform() === 'win32' ? 'oy.exe' : 'oy');
          const args = process.argv.slice(2);
          const child = spawn(exePath, args, { stdio: 'inherit' });
          child.on('exit', (code) => process.exit(code));
          WRAPPER_JS

      - name: Publish to npm with provenance
        run: |
          cd npm-package
          npm publish --provenance --access public --registry https://registry.npmjs.org/
