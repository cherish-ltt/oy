name: Release Build (oy-code-cli rename oy)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g., v1.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release?'
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build oy-code-cli (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Determine release tag
        id: tag
        shell: bash          # 关键：强制使用 bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RAW_TAG="${{ github.event.inputs.tag_name }}"
            CLEAN_TAG=$(echo "$RAW_TAG" | xargs)
          else
            CLEAN_TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [[ -z "$CLEAN_TAG" ]]; then
            echo "❌ Error: tag name is empty"
            exit 1
          fi
          echo "Using release tag: $CLEAN_TAG"
          echo "tag=$CLEAN_TAG" >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout specific tag (for manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        shell: bash          # 强制使用 bash
        run: |
          git fetch --tags
          git checkout tags/${{ steps.tag.outputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build -p oy-code-cli --release

      - name: Rename binary with platform suffix
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            ubuntu-latest)
              PLATFORM="x86_64-unknown-linux-gnu"
              EXT=""
              ;;
            macos-latest)
              PLATFORM="aarch64-apple-darwin"
              EXT=""
              ;;
            windows-latest)
              PLATFORM="x86_64-pc-windows-msvc"
              EXT=".exe"
              ;;
          esac
          cp "target/release/oy${EXT}" "oy-${PLATFORM}${EXT}"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: oy-*
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
